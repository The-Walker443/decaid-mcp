name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check of the shipped plugin
        run: node --check plugin.js
      - name: Tests
        # Serial: the budget test measures cost ratios and wants a quiet CPU.
        run: node --test --test-concurrency=1 "test/*.test.mjs"
